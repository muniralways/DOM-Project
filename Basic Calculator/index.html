<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Bootstrap Project</title>

  <!-- Bootstrap CSS -->

  <!-- Bootstrap Icons -->

  <!-- Font Awesome -->

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div class="calculator ">
  <div id="result">
    <h1 id="sub-res" style="font-size: 20px;">0</h1>
    <h1 id="finalResult" style="font-size: 40px;"></h1>
  </div>

  <div class="buttons">
    <button onclick="appendNumber('+')">+</button>
    <button onclick="appendNumber('-')">-</button>
    <button onclick="appendNumber('*')">*</button>
    <button onclick="appendNumber('/')">/</button>
    <button onclick="appendNumber('9')">9</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('6')">6</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('3')">3</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber('.')">.</button>
    
    <button class="clear" onclick="clearResult()">C</button>
    <button class="equal" onclick="finalResult()">=</button>
  </div>
</div>


  <!-- Bootstrap JS -->
  <!-- Custom JS -->
  <script src="assets/js/script.js"></script>
</body>
</html>
