<div class="card">

  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-md-4">
        <div class="mb-3">
          <label for="timer_taskInput" class="form-label">Todo Name</label>
          <input type="text" class="form-control" id="timer_taskInput" placeholder="Task Name">
        </div>
        <div class="mb-3">
          <select id="task_category" class="form-select">
            <option value="">Select Category</option>
          </select>
        </div>
      </div>
      <div class="col-md-6 d-flex flex-column align-items-center">
        <div class="position-relative" style="width: 150px; height: 150px;">
          <svg class="progress-ring" width="150" height="150">
            <circle class="progress-ring__circle" stroke="blue" stroke-width="8" fill="transparent" r="68" cx="75" cy="75"/>
          </svg>
          <div class="position-absolute top-50 start-50 translate-middle text-center">
            <h1 id="timeDisplay" class="mb-0">00:00</h1>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2 flex-wrap">
          <button class="btn btn-primary" id="startBtn">Start</button>
          <button class="btn btn-warning" id="pauseBtn">Pause</button>
          <button class="btn btn-danger" id="resetBtn">Reset</button>
          <button class="btn btn-secondary" id="saveBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- modal -->

  <!-- Task Modal -->
<div class="modal fade" id="input_modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Task</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="task_form">
          <div class="mb-3">
            <label for="task_name" class="form-label">Task Name</label>
            <input type="text" class="form-control" id="task_name" name="task_name" required>
          </div>
          <div class="mb-3">
            <label for="task_description" class="form-label">Task Description</label>
            <textarea class="form-control" id="task_description" name="task_description" rows="3" required></textarea>
          </div>
       <div class="mb-3">
          <select id="task_cate" class="form-select">
            <option value="">Select Category</option>
          </select>
        </div>
          <div class="mb-3">
            <label for="task_date" class="form-label">Due Date</label>
            <input type="date" class="form-control" id="task_date" name="due_date" required>
          </div>
       
      </div>
      <div class="modal-footer">
        <button id="saveButton" type="submit" form="task_form" class="btn btn-primary">Save</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div> 
    </form>
    </div>
  </div>
</div>

<!-- Category Modal -->
<div class="modal fade" id="catagory_modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="category_form">
          <div class="mb-3">
            <label for="catagory_name" class="form-label">Category Name</label>
            <input type="text" class="form-control" id="catagory_name" name="cata_name" required>
          </div>
          <div class="mb-3">
            <label for="catagory_description" class="form-label">Category Description</label>
            <textarea class="form-control" id="catagory_description" name="cata_description" rows="3" required></textarea>
          </div>
      
      </div>
      <div class="modal-footer">
        <button id="cata_save" type="submit" form="category_form" class="btn btn-primary">Save</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div> 
     </form>
    </div>
  </div>
</div>
